name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PortAudio is only needed for the optional [audio] extra; installing it
      # lets the one test that imports real pyaudio run instead of skipping.
      - name: Install PortAudio
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends portaudio19-dev

      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev,audio]"

      - name: Run tests
        run: python -m pytest -q

  install-from-git:
    # Mirrors what a consumer does: install straight from the repository URL
    # into a clean interpreter and import the package.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pip install from git
        run: python -m pip install "git+https://github.com/${{ github.repository }}.git@${{ github.sha }}"
      - name: Import check
        run: python -c "import assemblyai_agents as a; print(a.__version__); from assemblyai_agents import Client, VoiceAgent, tool, AgentConnection"
